name: Odoo Code Radar

on:
  schedule:
    - cron: "__CRON__"   # __WHEN__
  workflow_dispatch:        # and whenever you press "Run workflow"

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: niyasraphy/odoo-code-radar@v1
        with:
          token: ${{ secrets.RADAR_TOKEN }}
          author: ${{ vars.RADAR_AUTHOR }}   # optional; or set author in odoo-code-radar.yml
